[package]
name = "pulse"
version = "0.1.0"
edition = "2024"
description = "Agente mínimo de solo lectura: estado Docker en memoria servido por HTTP (glory-pulse)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
axum = "0.8"
bollard = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
serde_json = "1"

# 05AA-1 F2 piloto, alineado a receta 124A-OPT1 de NAKOMI: dev adelgazado
# (menos .pdb en target/). Solo tablas de lineas: breakpoints por linea y
# backtraces siguen; inspeccion de variables en el debugger se degrada.
# Si molesta, revertir.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
opt-level = 1
debug = false
